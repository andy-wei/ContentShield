[project]
name = "contentshield-backend"
version = "0.1.0"
description = "Llama-Guard-4-12B based content safety policy engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
    # 文件上传（训练数据集上传用 UploadFile）
    "python-multipart>=0.0.9",
    # DevSecOps 扫描任务队列
    "celery>=5.4.0",
    "redis>=5.0.0",
]

[project.scripts]
cs-scan = "app.scan.cli:main"

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0", "psycopg2-binary>=2.9.9"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    # 扫描工具（开发期本地跑扫描用；CI/生产装在 worker 镜像里）
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---- Ruff 配置 ----
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["models", "data"]

[tool.ruff.lint]
# 启用的规则集：
# E/W   pycodestyle（基础风格）
# F     pyflakes（未使用导入/变量等真实 bug）
# I     isort（导入排序）
# UP    pyupgrade（现代化语法）
# B     bugbear（常见 bug 模式）
# SIM   simplify（代码简化）
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # 行长由 line-length 控制，不强制报错（format 会处理）
    "B008",   # FastAPI Depends() 在默认参数是惯用法
    "B027",   # 检测器基类的 warmup/shutdown 钩子故意不用 @abstractmethod（鸭子类型）
    "B904",   # raise from：有价值但工作量大，后续阶段统一处理
    "SIM105", # contextlib.suppress：多处 try/except/pass 是有意设计（迁移忽略、降级）
    "SIM108", # 三元 vs if/else，不强制
    "SIM117", # 合并 with：httpx stream 嵌套合并可能改变语义
]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许断言、未使用 fixture 参数
"tests/**" = ["B017", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
