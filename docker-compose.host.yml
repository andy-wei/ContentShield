# =============================================================================
# Override：Apple Silicon 宿主机推理方案（M1/M2/M3/M4）
#
# 模型服务（llama-server）跑在宿主机原生进程，享受 Metal GPU 加速。
# 后端/前端仍在 Docker 跑，通过 host.docker.internal 访问宿主机模型服务。
#
# 启动：
#   1. 先在宿主机启动两个 llama-server（见 scripts/start_models_mac.sh）
#   2. docker compose -f docker-compose.yml -f docker-compose.host.yml up -d --build
#
# 优势：Docker 容器无法访问 Apple Metal，此方案让模型推理用上 GPU，毫秒级响应。
# =============================================================================
services:
  backend:
    # 覆盖：不依赖 llama-cpp-pg 容器（模型服务在宿主机）
    depends_on: !reset []
    extra_hosts:
      # 容器内 host.docker.internal 解析到宿主机
      - "host.docker.internal:host-gateway"
    environment:
      # 明确指向宿主机端口
      - LLAMA_CPP_BASE_URL=http://host.docker.internal:8082
      - PROMPT_GUARD_BASE_URL=http://host.docker.internal:8081

  # 不启动容器化模型服务
  llama-cpp-pg: !reset []
