# =============================================================================
# ContentShield 基础编排（默认 cloud profile：Llama-Guard-4 走云 API）
#
# 启动：
#   docker compose up -d --build
#
# 切换到本地 GPU：
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# 切换到纯本地 CPU：
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --build
# =============================================================================
name: contentshield

services:
  # ---------------------------------------------------------------------------
  # 后端 API（FastAPI）：检测编排、网关代理、规则/审计管理、扫描 API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    image: contentshield-backend:latest
    container_name: cs-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # SQLite 数据库 + 词库热更新
      - ./data:/app/data
    depends_on:
      - llama-cpp-pg
      - redis
    networks:
      - cs-net

  # ---------------------------------------------------------------------------
  # Redis：Celery broker/backend + 未来限流后端
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cs-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - cs-net

  # ---------------------------------------------------------------------------
  # Celery Worker：异步执行 DevSecOps 扫描任务
  # 挂载 docker.sock 用于 trivy 镜像扫描；扫描产物在 worker-data
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: ./backend
    image: contentshield-backend:latest
    container_name: cs-celery-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      # worker 需要访问 backend 的 DB（共享 SQLite 卷）
      - DATABASE_URL=sqlite+aiosqlite:////app/data/contentshield.db
    command: celery -A app.scan.celery_app worker --loglevel=info --concurrency=2
    # 覆盖 Dockerfile 的 HTTP 健康检查：worker 无 HTTP 端点，改用 celery inspect ping
    # ping 不指定 destination 会查询所有在线 worker，单 worker 也能正常返回 pong
    healthcheck:
      test: ["CMD", "celery", "-A", "app.scan.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      # 共享 SQLite 数据库
      - ./data:/app/data
      # 扫描时拉取的代码临时存放（可选，便于排查）
      - worker-data:/tmp/cs_scan
      # 挂载 docker.sock 让 trivy 能扫镜像（可选）
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - backend
    networks:
      - cs-net

  # ---------------------------------------------------------------------------
  # 前端（React SPA，nginx 静态托管 + 反代后端 API）
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=/api
    image: contentshield-frontend:latest
    container_name: cs-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - cs-net

  # ---------------------------------------------------------------------------
  # Prompt Guard 2 86M（提示词注入/越狱检测）
  # 轻量级，所有 profile 都用 llama.cpp CPU 跑，毫秒级
  # ---------------------------------------------------------------------------
  llama-cpp-pg:
    build:
      context: ./inference/llama-cpp
    image: contentshield-llama-cpp:latest
    container_name: cs-llama-cpp-pg
    restart: unless-stopped
    environment:
      - MODEL_PATH=${PROMPT_GUARD_GGUF_PATH:-/models/Llama-Prompt-Guard-2-86M-Q8_0.gguf}
      - N_THREADS=${LLAMA_CPP_THREADS:-8}
      - PORT=8080
      - CONTEXT_SIZE=4096
    volumes:
      - ./models:/models:ro
    ports:
      - "8081:8080"
    networks:
      - cs-net

networks:
  cs-net:
    driver: bridge

volumes:
  redis-data:
  worker-data:
